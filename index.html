<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pistil Pioneers — Time Clock</title>
<style>
  :root {
    --pine: #1f3626;
    --pine-deep: #142418;
    --canopy: #3f6b45;
    --gold: #c99a3e;
    --gold-dark: #a97e2c;
    --parchment: #f4efdf;
    --paper: #fbf8ef;
    --ink: #241f18;
    --line: #ddd3b6;
    --good: #3f6b45;
    --bad: #a3432f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--parchment);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(63,107,69,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,154,62,0.08), transparent 45%);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .clock {
    width: 100%;
    max-width: 430px;
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 var(--gold) inset;
  }
  .brandbar {
    background: var(--pine);
    background-image: linear-gradient(180deg, var(--pine) 0%, var(--pine-deep) 100%);
    color: var(--parchment);
    padding: 22px 28px 20px;
    text-align: center;
    border-bottom: 3px solid var(--gold);
  }
  .brandbar .logo-plate {
    background: var(--parchment);
    display: inline-block;
    padding: 8px 16px;
    margin: 0 auto 10px;
    border-radius: 3px;
  }
  .brandbar .logo {
    height: 42px;
    max-width: 220px;
    object-fit: contain;
    display: block;
  }
  .brandbar h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0.06em;
    font-weight: 400;
  }
  .brandbar .tagline {
    margin-top: 4px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .plate {
    text-align: center;
    padding: 22px 28px 18px;
    border-bottom: 1px solid var(--line);
  }
  .plate .time {
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 40px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--pine);
    letter-spacing: 0.01em;
  }
  .plate .time .ampm {
    font-size: 16px;
    font-weight: 700;
    margin-left: 4px;
    color: var(--gold-dark);
  }
  .plate .date {
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 12px;
    opacity: 0.65;
    margin-top: 4px;
  }
  .body-pad { padding: 26px 28px 28px; }
  #scanBtn {
    width: 100%;
    padding: 20px;
    font-size: 14px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--gold);
    color: var(--pine-deep);
    border: none;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #scanBtn:active { background: var(--gold-dark); }
  #scanBtn:disabled { opacity: 0.5; cursor: default; }
  #status {
    margin-top: 18px;
    min-height: 60px;
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
  }
  #status .name { font-family: Georgia, serif; font-size: 19px; font-weight: 700; display: block; color: var(--pine); }
  #status .punch { display: inline-block; margin-top: 4px; padding: 3px 12px; border: 1px solid currentColor; letter-spacing: 0.05em; }
  #status .punch.in { color: var(--good); }
  #status .punch.out { color: var(--bad); }
  #status .err { color: var(--bad); }
  .log {
    margin-top: 22px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
  }
  .log h2 {
    font-size: 11px;
    letter-spacing: 0.12em;
    opacity: 0.6;
    margin: 0 0 8px;
    font-weight: 700;
    color: var(--pine);
  }
  .log ul { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  .log li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dotted var(--line); }
  .log li:last-child { border-bottom: none; }
  .setup {
    margin-top: 20px;
    font-size: 11px;
    opacity: 0.6;
    text-align: center;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
  }
  .setup a { color: var(--pine); cursor: pointer; text-decoration: underline; }
  .admin {
    margin-top: 18px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
    display: none;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
  }
  .admin.open { display: block; }
  .admin h2 {
    font-size: 11px;
    letter-spacing: 0.1em;
    opacity: 0.6;
    margin: 0 0 10px;
    font-weight: 700;
    color: var(--pine);
  }
  .admin label {
    display: block;
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .admin input {
    width: 100%;
    padding: 9px 10px;
    font-family: inherit;
    font-size: 13px;
    border: 1px solid var(--line);
    background: #fff;
    margin-bottom: 10px;
  }
  .admin .row { display: flex; gap: 8px; }
  .admin button {
    flex: 1;
    padding: 12px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border: 1px solid var(--gold-dark);
    background: #fff;
    color: var(--gold-dark);
    cursor: pointer;
  }
  .admin button.primary {
    background: var(--pine);
    color: var(--parchment);
    border-color: var(--pine);
  }
  .admin button:disabled { opacity: 0.5; cursor: default; }
  .admin .scanTip {
    font-size: 11px;
    opacity: 0.6;
    margin: -4px 0 10px;
  }
  .admin #adminMsg {
    font-size: 12px;
    margin-top: 10px;
    min-height: 16px;
  }
  .admin #adminMsg.ok { color: var(--good); }
  .admin #adminMsg.err { color: var(--bad); }
</style>
</head>
<body>

<div class="clock">
  <div class="brandbar">
    <div class="logo-plate">
      <img class="logo" src="https://www.pistilpioneers.com/wp-content/uploads/2021/06/pistil-logo-2021.png" alt="Pistil Pioneers logo">
    </div>
    <h1>PISTIL PIONEERS</h1>
    <div class="tagline">Oregon Grown · Time Clock</div>
  </div>

  <div class="plate">
    <div class="time" id="liveTime">--:--<span class="ampm" id="liveAmpm">--</span></div>
    <div class="date" id="liveDate">--</div>
  </div>

  <div class="body-pad">
    <button id="scanBtn">Tap Card to Clock In / Out</button>

    <div id="status">Waiting for a card&hellip;</div>

    <div class="log">
      <h2>RECENT PUNCHES</h2>
      <ul id="logList"></ul>
    </div>

    <div class="setup">
      Reader: <span id="nfcSupport">checking&hellip;</span>
      &nbsp;·&nbsp;<a id="adminToggle">Manage employees</a>
    </div>

    <div class="admin" id="adminPanel">
      <h2>ADD OR RENAME AN EMPLOYEE</h2>

      <label for="adminCardId">Card ID</label>
      <input id="adminCardId" type="text" placeholder="e.g. 04A1B2C3" autocomplete="off">
      <div class="scanTip">Don't know the ID? Use "Scan to fill in" below, or tap the card on the main button first — it'll show up as unrecognized.</div>

      <label for="adminName">Employee name</label>
      <input id="adminName" type="text" placeholder="e.g. Jane Doe" autocomplete="off">

      <div class="row">
        <button id="adminScanBtn">SCAN TO FILL IN</button>
        <button id="adminSaveBtn" class="primary">SAVE</button>
      </div>
      <div id="adminMsg"></div>
    </div>
  </div>
</div>

<script>
// ====== CONFIGURATION ======
// Paste the /exec URL you get after deploying the Apps Script web app.
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxRZHB9RagwzTYyGlxZUnquni0zd6jg648MYRHf7yGtI3ocY7EkW8PseP1I05sdSOy_FA/exec";
// Time zone shown on the live clock (US Pacific, since Pistil Pioneers is in Lane County, Oregon).
// Change to another US zone if needed: "America/Denver", "America/Chicago", "America/New_York".
const DISPLAY_TIMEZONE = "America/Los_Angeles";
// ============================

const scanBtn = document.getElementById('scanBtn');
const statusEl = document.getElementById('status');
const logList = document.getElementById('logList');
const nfcSupportEl = document.getElementById('nfcSupport');
const liveTime = document.getElementById('liveTime');
const liveAmpm = document.getElementById('liveAmpm');
const liveDate = document.getElementById('liveDate');

function tickClock() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('en-US', { hour12: true, hour: 'numeric', minute: '2-digit', timeZone: DISPLAY_TIMEZONE });
  const parts = timeStr.split(' ');
  liveTime.firstChild.textContent = parts[0];
  liveAmpm.textContent = parts[1] || '';
  liveDate.textContent = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: DISPLAY_TIMEZONE });
}
tickClock();
setInterval(tickClock, 1000);

function addLogRow(name, punch, time) {
  const li = document.createElement('li');
  li.innerHTML = `<span>${name}</span><span>${punch.toUpperCase()} · ${time}</span>`;
  logList.prepend(li);
  while (logList.children.length > 8) logList.removeChild(logList.lastChild);
}

async function sendPunch(cardId) {
  statusEl.innerHTML = 'Reading card&hellip;';
  scanBtn.disabled = true;
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ cardId })
    });
    const data = await res.json();
    if (data.error) {
      statusEl.innerHTML = `<span class="err">${data.error}</span>`;
    } else {
      const punchClass = data.punch === 'in' ? 'in' : 'out';
      statusEl.innerHTML = `
        <span class="name">${data.name}</span>
        <span class="punch ${punchClass}">CLOCKED ${data.punch.toUpperCase()}</span>
        <div style="margin-top:4px; opacity:0.6;">${data.time}</div>
      `;
      addLogRow(data.name, data.punch, data.time);
    }
  } catch (err) {
    statusEl.innerHTML = `<span class="err">Couldn't reach the sheet. Check connection.</span>`;
  } finally {
    scanBtn.disabled = false;
  }
}

// Manual fallback / testing: type a card ID and press Enter via prompt
scanBtn.addEventListener('click', () => {
  if (!('NDEFReader' in window)) {
    const manual = prompt('NFC not available on this device/browser.\nEnter a card ID manually to test:');
    if (manual) sendPunch(manual.trim());
    return;
  }
  startScan();
});

async function startScan() {
  try {
    const ndef = new NDEFReader();
    await ndef.scan();
    statusEl.textContent = 'Ready — hold a card to the back of the device.';
    ndef.onreading = (event) => {
      const cardId = event.serialNumber || 'unknown';
      sendPunch(cardId);
    };
    ndef.onreadingerror = () => {
      statusEl.innerHTML = '<span class="err">Could not read that card. Try again.</span>';
    };
  } catch (err) {
    statusEl.innerHTML = `<span class="err">NFC permission denied or unavailable.</span>`;
  }
}

if ('NDEFReader' in window) {
  nfcSupportEl.textContent = 'Web NFC supported (tap the button to start)';
} else {
  nfcSupportEl.textContent = 'Web NFC not supported in this browser — use Chrome on Android, or the manual test prompt';
}

// ---- Manage employees panel ----
const adminToggle = document.getElementById('adminToggle');
const adminPanel = document.getElementById('adminPanel');
const adminCardId = document.getElementById('adminCardId');
const adminName = document.getElementById('adminName');
const adminScanBtn = document.getElementById('adminScanBtn');
const adminSaveBtn = document.getElementById('adminSaveBtn');
const adminMsg = document.getElementById('adminMsg');

adminToggle.addEventListener('click', () => {
  adminPanel.classList.toggle('open');
  adminToggle.textContent = adminPanel.classList.contains('open') ? 'Close' : 'Manage employees';
});

adminScanBtn.addEventListener('click', async () => {
  if (!('NDEFReader' in window)) {
    const manual = prompt('NFC not available here. Enter the card ID manually:');
    if (manual) adminCardId.value = manual.trim();
    return;
  }
  try {
    const ndef = new NDEFReader();
    await ndef.scan();
    adminMsg.textContent = 'Hold the card to the back of the device…';
    adminMsg.className = '';
    ndef.onreading = (event) => {
      adminCardId.value = event.serialNumber || '';
      adminMsg.textContent = 'Card ID captured. Enter a name and save.';
      adminMsg.className = 'ok';
    };
  } catch (err) {
    adminMsg.textContent = 'NFC permission denied or unavailable.';
    adminMsg.className = 'err';
  }
});

adminSaveBtn.addEventListener('click', async () => {
  const cardId = adminCardId.value.trim();
  const name = adminName.value.trim();
  if (!cardId || !name) {
    adminMsg.textContent = 'Enter both a card ID and a name.';
    adminMsg.className = 'err';
    return;
  }
  adminSaveBtn.disabled = true;
  adminMsg.textContent = 'Saving…';
  adminMsg.className = '';
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'setEmployee', cardId, name })
    });
    const data = await res.json();
    if (data.error) {
      adminMsg.textContent = data.error;
      adminMsg.className = 'err';
    } else {
      adminMsg.textContent = `Saved: ${data.name} (${data.cardId}) — ${data.mode === 'updated' ? 'name updated' : 'new employee added'}.`;
      adminMsg.className = 'ok';
      adminCardId.value = '';
      adminName.value = '';
    }
  } catch (err) {
    adminMsg.textContent = "Couldn't reach the sheet. Check connection.";
    adminMsg.className = 'err';
  } finally {
    adminSaveBtn.disabled = false;
  }
});
</script>

</body>
</html>
